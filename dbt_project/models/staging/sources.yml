version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: raw_channels
        columns:
          - name: channel_id
            tests: [not_null]
      - name: raw_videos
        columns:
          - name: video_id
            tests: [not_null]